name: Python validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: python -m pip install -e . httpx
      - name: Compile sources
        run: python -m compileall -q hexforge tests
      - name: Run isolated synthetic unit tests
        run: python -m unittest discover -s tests -v

  javascript-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: |
          for f in web/*.js hexforge/server/static/*.js; do
            node --check "$f" || exit 1
          done
